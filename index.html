<!DOCTYPE html>
<html lang="en" data-contrast="normal" data-text-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Pixelify Sans: Latin and Cyrillic; DotGothic16: Japanese; Atkinson Hyperlegible and Lexend: easy-to-read
     fonts. A font is only downloaded when it's actually used. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=DotGothic16&family=Lexend:wght@400;600&family=Pixelify+Sans:wght@400;600&display=swap">
<!-- Bump ?v= on every update so browsers load the new files, not an old saved copy -->
<link rel="stylesheet" href="style.css?v=20261106-14">
</head>
<body>
<!-- Texts marked data-i18n (and data-i18n-label/-title/-alt) are filled in from i18n.js and lang/*.js -->
<div class="game">
  <!-- Top bar: reset on the left; help, looks and settings on the right -->
  <div class="top-bar">
    <button type="button" id="reset-button" class="icon-button" data-i18n-label="top.reset" data-i18n-title="top.reset">↺</button>
    <div class="top-bar-right">
      <button type="button" id="info-button" class="icon-button" data-i18n-label="top.info" data-i18n-title="top.info">ℹ️</button>
      <button type="button" id="looks-button" class="icon-button" data-i18n-label="top.looks" data-i18n-title="top.looks"><img id="looks-icon" alt=""></button>
      <button type="button" id="cat-button" class="icon-button" data-i18n-label="top.cat" data-i18n-title="top.cat"><img id="cat-icon" alt=""></button>
      <button type="button" id="relations-button" class="icon-button" data-i18n-label="settings.relationships" data-i18n-title="settings.relationships">💕</button>
      <button type="button" id="settings-button" class="icon-button" data-i18n-label="top.settings" data-i18n-title="top.settings">⚙️</button>
    </div>
  </div>

  <!-- Your cats: click a face to switch, + to adopt another -->
  <nav id="cat-switcher" data-i18n-label="switcher.label"></nav>

  <!-- Shown while the cat still has lives -->
  <section id="playing-view">
    <h1 id="cat-name">Cat</h1>
    <p class="age" data-i18n="age"></p>
    <p id="birthday-line" class="birthday-line" data-i18n="birthday" hidden></p>
    <button type="button" id="relations-toggle" class="relations-toggle" aria-expanded="false" aria-controls="relations" hidden></button>
    <ul id="relations" class="relations" hidden></ul>

    <h3 class="mood"><span data-i18n="mood.label"></span> <span id="mood"></span></h3>

    <div class="stats">
      <h3><span data-i18n="stat.hunger"></span>: <span id="hunger-value"></span>%</h3>
      <div class="bar"><div class="hunger" id="hunger-bar"></div></div>

      <h3><span data-i18n="stat.happiness"></span>: <span id="happiness-value"></span>%</h3>
      <div class="bar"><div class="happy" id="happiness-bar"></div></div>

      <h3><span data-i18n="stat.energy"></span>: <span id="energy-value"></span>%</h3>
      <div class="bar"><div class="energy" id="energy-bar"></div></div>

      <h3><span data-i18n="stat.cleanliness"></span>: <span id="cleanliness-value"></span>%</h3>
      <div class="bar"><div class="cleanliness" id="cleanliness-bar"></div></div>
    </div>

    <div class="message-row">
      <p class="message" id="message"></p>
      <button type="button" id="history-button" class="tiny-button" data-i18n-label="history.button" data-i18n-title="history.button" aria-expanded="false" aria-controls="history">🕘</button>
    </div>
    <ol id="history" class="history" hidden></ol>

    <h3><span data-i18n="lives"></span>: <span id="lives-value"></span></h3>
    <p id="hearts"></p>
    <p id="health" class="health" hidden></p>

    <div id="cat-pictures">
      <img id="cat-image" data-i18n-alt="cat.alt">
      <img id="friend-image" alt="" hidden>
    </div>

    <div class="actions">
      <button data-action="vet" id="vet-button" class="vet-button" data-i18n="btn.vet" hidden></button>
      <section class="action-group" aria-labelledby="care-heading">
        <h4 id="care-heading" data-i18n="group.care"></h4>
        <button data-action="feed" data-i18n="btn.feed"></button>
        <button data-action="brush" data-i18n="btn.brush"></button>
        <button data-action="sleep" data-i18n="btn.sleep"></button>
      </section>
      <section class="action-group" aria-labelledby="play-heading">
        <h4 id="play-heading" data-i18n="group.play"></h4>
        <button data-action="play" data-i18n="btn.play"></button>
        <button type="button" id="laser-button" data-i18n="btn.laser"></button>
        <button type="button" id="together-button" data-i18n="btn.together" hidden></button>
      </section>
      <section class="action-group" aria-labelledby="cuddle-heading">
        <h4 id="cuddle-heading" data-i18n="group.cuddle"></h4>
        <button data-action="pet" data-i18n="btn.pet"></button>
        <button data-action="bellyRub" data-i18n="btn.bellyRub"></button>
        <button data-action="meow" data-i18n="btn.meow"></button>
      </section>
    </div>
  </section>

  <!-- Shown when the cat has run out of lives -->
  <section id="game-over-view" hidden>
    <h1 class="game-over" data-i18n="gameover.title"></h1>
    <img id="game-over-image" data-i18n-alt="gameover.alt">
    <h2 data-i18n="gameover.text"></h2>
    <button data-action="reset" data-i18n="gameover.restart"></button>
  </section>

  <!-- Settings: the cat, its relationships, and the whole game -->
  <dialog id="settings-dialog" class="dialog">
    <button type="button" class="icon-button dialog-close" data-i18n-label="close">✕</button>
    <h2 data-i18n="settings.title"></h2>
    <form id="settings-form">
      <h3 data-i18n="settings.game"></h3>
      <div class="setting">
        <label for="language-input" data-i18n="settings.language"></label>
        <select id="language-input"></select>
      </div>
      <div class="setting">
        <label for="text-size-input" data-i18n="settings.textSize"></label>
        <select id="text-size-input">
          <option value="normal" data-i18n="size.normal"></option>
          <option value="large" data-i18n="size.large"></option>
          <option value="extra-large" data-i18n="size.extra-large"></option>
        </select>
      </div>
      <div class="setting">
        <label for="font-input" data-i18n="settings.font"></label>
        <select id="font-input">
          <option value="pixel" data-i18n="font.pixel"></option>
          <option value="atkinson" data-i18n="font.atkinson"></option>
          <option value="lexend" data-i18n="font.lexend"></option>
        </select>
      </div>
      <div class="setting">
        <label for="short-input" data-i18n="settings.short"></label>
        <input type="checkbox" id="short-input">
      </div>
      <div class="setting">
        <label for="contrast-input" data-i18n="settings.contrast"></label>
        <select id="contrast-input">
          <option value="normal" data-i18n="contrast.normal"></option>
          <option value="high" data-i18n="contrast.high"></option>
          <option value="dark" data-i18n="contrast.dark"></option>
        </select>
      </div>
      <div class="setting">
        <label for="sound-input" data-i18n="settings.sound"></label>
        <input type="checkbox" id="sound-input">
      </div>
      <div class="setting">
        <label for="motion-input" data-i18n="settings.motion"></label>
        <input type="checkbox" id="motion-input">
      </div>
      <div class="setting">
        <label for="flash-input" data-i18n="settings.flash"></label>
        <input type="checkbox" id="flash-input">
      </div>
      <div class="setting">
        <label for="illness-input" data-i18n="settings.illness"></label>
        <input type="checkbox" id="illness-input">
      </div>

      <p id="settings-error" class="message"></p>
      <button type="submit" data-i18n="settings.save"></button>
    </form>
  </dialog>

  <!-- The colored cat head: name, age, gender, personality -->
  <dialog id="catinfo-dialog" class="dialog">
    <button type="button" class="icon-button dialog-close" data-i18n-label="close">✕</button>
    <h2 data-i18n="catinfo.title"></h2>
    <form id="catinfo-form">
      <div class="setting">
        <label for="name-input" data-i18n="settings.name"></label>
        <input type="text" id="name-input" maxlength="30" required>
      </div>
      <div class="setting">
        <label for="age-input" data-i18n="settings.age"></label>
        <input type="number" id="age-input" min="0" max="30" required>
      </div>
      <div class="setting">
        <label for="gender-input" data-i18n="settings.gender"></label>
        <select id="gender-input">
          <option value="female" data-i18n="gender.female"></option>
          <option value="male" data-i18n="gender.male"></option>
          <option value="none" data-i18n="gender.none"></option>
        </select>
      </div>
      <div class="setting">
        <label for="personality-input" data-i18n="settings.personality"></label>
        <select id="personality-input"></select>
      </div>
      <p id="catinfo-error" class="message form-error"></p>
      <button type="submit" data-i18n="save"></button>
    </form>
  </dialog>

  <!-- 💕 Relationships: family, and friends / couples / rivals -->
  <dialog id="relations-dialog" class="dialog">
    <button type="button" class="icon-button dialog-close" data-i18n-label="close">✕</button>
    <h2 data-i18n="settings.relationships"></h2>
    <h3 id="family-heading" data-i18n="relations.family"></h3>
    <ul id="family-list" class="family-list"></ul>
    <form id="relations-form">
      <div id="relation-settings"></div>
      <p id="relations-error" class="message form-error"></p>
      <button type="submit" data-i18n="save"></button>
    </form>
  </dialog>

  <!-- Looks: color, coat and eyes -->
  <dialog id="looks-dialog" class="dialog">
    <button type="button" class="icon-button dialog-close" data-i18n-label="close">✕</button>
    <h2 data-i18n="looks.title"></h2>
    <img id="looks-preview" class="looks-preview" data-i18n-alt="looks.preview">
    <form id="looks-form">
      <div class="setting">
        <label for="color-input" data-i18n="looks.color"></label>
        <select id="color-input"></select>
      </div>
      <div class="setting">
        <label for="coat-input" data-i18n="looks.coat"></label>
        <select id="coat-input"></select>
      </div>
      <div class="setting">
        <label for="eyes-input" data-i18n="looks.eyes"></label>
        <select id="eyes-input"></select>
      </div>
      <button type="submit" data-i18n="looks.save"></button>
    </form>
  </dialog>

  <!-- What the buttons do -->
  <dialog id="info-dialog" class="dialog info">
    <button type="button" class="icon-button dialog-close" data-i18n-label="close">✕</button>
    <h2 data-i18n="info.title"></h2>
    <p data-i18n="info.intro"></p>
    <h3 data-i18n="group.care"></h3>
    <dl>
      <dt data-i18n="info.feed.term"></dt><dd data-i18n="info.feed"></dd>
      <dt data-i18n="info.brush.term"></dt><dd data-i18n="info.brush"></dd>
      <dt data-i18n="info.sleep.term"></dt><dd data-i18n="info.sleep"></dd>
      <dt data-i18n="info.vet.term"></dt><dd data-i18n="info.vet"></dd>
    </dl>
    <h3 data-i18n="group.play"></h3>
    <dl>
      <dt data-i18n="info.play.term"></dt><dd data-i18n="info.play"></dd>
      <dt data-i18n="info.laser.term"></dt><dd data-i18n="info.laser"></dd>
      <dt data-i18n="info.together.term"></dt><dd data-i18n="info.together"></dd>
    </dl>
    <h3 data-i18n="group.cuddle"></h3>
    <dl>
      <dt data-i18n="info.pet.term"></dt><dd data-i18n="info.pet"></dd>
      <dt data-i18n="info.bellyRub.term"></dt><dd data-i18n="info.bellyRub"></dd>
      <dt data-i18n="info.meow.term"></dt><dd data-i18n="info.meow"></dd>
    </dl>
    <h3 data-i18n="info.top"></h3>
    <dl>
      <dt>↺</dt><dd data-i18n="info.reset"></dd>
      <dt data-i18n="info.faces.term"></dt><dd data-i18n="info.faces"></dd>
      <dt><img class="info-icon" id="info-tree-icon" alt=""> <span data-i18n="info.tree.term"></span></dt><dd data-i18n="info.tree"></dd>
      <dt><span class="info-alert">!</span> <span data-i18n="info.alert.term"></span></dt><dd data-i18n="info.alert"></dd>
      <dt data-i18n="info.looks.term"></dt><dd data-i18n="info.looks"></dd>
      <dt><img class="info-icon" id="info-cat-icon" alt=""> <span data-i18n="info.cat.term"></span></dt><dd data-i18n="info.cat"></dd>
      <dt>💕 <span data-i18n="info.relations.term"></span></dt><dd data-i18n="info.relations"></dd>
      <dt>⚙️</dt><dd data-i18n="info.settings"></dd>
      <dt>🕘</dt><dd data-i18n="info.history"></dd>
    </dl>
  </dialog>

  <!-- Make a new cat (the + in the cat row) -->
  <dialog id="newcat-dialog" class="dialog">
    <button type="button" class="icon-button dialog-close" data-i18n-label="close">✕</button>
    <h2 data-i18n="newcat.title"></h2>
    <img id="newcat-preview" class="looks-preview" data-i18n-alt="looks.preview">
    <form id="newcat-form">
      <div class="setting">
        <label for="new-name" data-i18n="settings.name"></label>
        <input type="text" id="new-name" maxlength="30" required>
      </div>
      <div class="setting">
        <label for="new-age" data-i18n="settings.age"></label>
        <input type="number" id="new-age" min="0" max="30" required>
      </div>
      <div class="setting">
        <label for="new-gender" data-i18n="settings.gender"></label>
        <select id="new-gender">
          <option value="female" data-i18n="gender.female"></option>
          <option value="male" data-i18n="gender.male"></option>
          <option value="none" data-i18n="gender.none"></option>
        </select>
      </div>
      <div class="setting">
        <label for="new-personality" data-i18n="settings.personality"></label>
        <select id="new-personality"></select>
      </div>
      <div class="setting">
        <label for="new-color" data-i18n="looks.color"></label>
        <select id="new-color"></select>
      </div>
      <div class="setting">
        <label for="new-coat" data-i18n="looks.coat"></label>
        <select id="new-coat"></select>
      </div>
      <div class="setting">
        <label for="new-eyes" data-i18n="looks.eyes"></label>
        <select id="new-eyes"></select>
      </div>
      <p id="newcat-error" class="message"></p>
      <button type="submit" data-i18n="newcat.create"></button>
    </form>
  </dialog>

  <!-- Delete this cat? (click the chosen cat's face again) -->
  <dialog id="delete-dialog" class="dialog confirm">
    <form method="dialog">
      <h2 data-i18n="delete.title"></h2>
      <img id="delete-face" class="delete-face" alt="">
      <p id="delete-name" class="delete-name"></p>
      <button value="yes" class="danger-solid" data-i18n="yes"></button>
      <button value="no" autofocus data-i18n="confirm.no"></button>
    </form>
  </dialog>

  <!-- Family tree -->
  <dialog id="family-dialog" class="dialog family">
    <button type="button" class="icon-button dialog-close" data-i18n-label="close">✕</button>
    <h2 data-i18n="family.title"></h2>
    <div id="family-tree"></div>
  </dialog>

  <!-- "Are you sure?" -->
  <dialog id="confirm-dialog" class="dialog confirm">
    <form method="dialog">
      <h2 data-i18n="confirm.title"></h2>
      <p id="confirm-text"></p>
      <button value="yes" id="confirm-yes" class="danger-solid"></button>
      <button value="no" autofocus data-i18n="confirm.no"></button>
    </form>
  </dialog>

</div>
<script src="sprites.js?v=20261106-14"></script>
<script src="sound.js?v=20261106-14"></script>
<script src="i18n.js?v=20261106-14"></script>
<script src="lang/da.js?v=20261106-14"></script>
<script src="lang/de.js?v=20261106-14"></script>
<script src="lang/ru.js?v=20261106-14"></script>
<script src="lang/es.js?v=20261106-14"></script>
<script src="lang/fi.js?v=20261106-14"></script>
<script src="lang/it.js?v=20261106-14"></script>
<script src="lang/fr.js?v=20261106-14"></script>
<script src="lang/zh.js?v=20261106-14"></script>
<script src="lang/ja.js?v=20261106-14"></script>
<script src="lang/ko.js?v=20261106-14"></script>
<script src="game.js?v=20261106-14"></script>
</body>
</html>
